openapi: 3.0.3
info:
  title: Urban Flow Governance - User Management API
  version: 1.0.0
  description: Login/Logout und Admin-Nutzerverwaltung mit Bearer-Token (UUID in DB, Timeout per TOKEN_TTL_MINUTES).
servers:
  - url: /
paths:
  /api/session:
    get:
      summary: Aktuelle Session-Userinfo abrufen
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User info erfolgreich geladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserInfo'
              example:
                status: success
                msg: User info loaded
                data:
                  user:
                    id: 1
                    username: admin
                    role: ADMIN
        '401':
          description: Login required oder Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      summary: Benutzer anmelden
      description: Liefert bei erfolgreichem Login ein Bearer-Token zur Nutzung im Authorization-Header.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLogin'
              example:
                status: success
                msg: Login successful
                data:
                  token: 9e5d13a0-6b5e-4c20-8af3-e991b655f350
                  token_type: Bearer
                  expires_in_minutes: 60
        '400':
          description: username oder password fehlt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Ungueltige Zugangsdaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      summary: Benutzer abmelden
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Login required oder Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/users:
    post:
      summary: Nutzer erstellen (nur ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  default: NUTZER
                  enum: [ADMIN, NUTZER]
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validierungsfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Login required, Invalid token oder Session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Role ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/users/{id}:
    put:
      summary: Nutzer aktualisieren (nur ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, NUTZER]
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validierungsfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Login required, Invalid token oder Session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Role ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    patch:
      summary: Nutzer teilaktualisieren (nur ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, NUTZER]
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validierungsfehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Login required, Invalid token oder Session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Role ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      summary: Nutzer loeschen (nur ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Login required, Invalid token oder Session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Role ADMIN required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID
  schemas:
    ApiResponse:
      type: object
      required: [status, msg]
      properties:
        status:
          type: string
          enum: [success, failure]
        msg:
          type: string
        data:
          type: object
          additionalProperties: true
    ApiResponseLogin:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              required: [token, token_type, expires_in_minutes]
              properties:
                token:
                  type: string
                  format: uuid
                token_type:
                  type: string
                  enum: [Bearer]
                expires_in_minutes:
                  type: integer
                  minimum: 1
    ApiResponseUserInfo:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              required: [user]
              properties:
                user:
                  type: object
                  required: [id, username, role]
                  properties:
                    id:
                      type: integer
                      format: int64
                    username:
                      type: string
                    role:
                      type: string
                      enum: [ADMIN, NUTZER]