<!DOCTYPE html>
<html data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Urban Governance Flow</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div id="login-overlay">
  <div id="login-box">
    <h2>Urban Flow Governance</h2>

    <div id="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Anmelden</button>
      <button class="auth-tab" onclick="switchTab('register')">Registrieren</button>
    </div>

    <form id="login-form" onsubmit="submitLogin(event)">
      <div class="login-field">
        <label for="login-username">Benutzername</label>
        <input id="login-username" type="text" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="login-password">Passwort</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </div>
      <p class="auth-error" id="login-error"></p>
      <button type="submit">Anmelden</button>
    </form>

    <form id="register-form" onsubmit="submitRegister(event)" style="display:none">
      <div class="login-field">
        <label for="reg-username">Benutzername</label>
        <input id="reg-username" type="text" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label for="reg-password">Passwort</label>
        <input id="reg-password" type="password" autocomplete="new-password" required>
      </div>
      <div class="login-field">
        <label for="reg-password2">Passwort wiederholen</label>
        <input id="reg-password2" type="password" autocomplete="new-password" required>
      </div>
      <p class="auth-error" id="register-error"></p>
      <button type="submit">Registrieren</button>
    </form>
  </div>
</div>

<nav id="sidebar">
  <div id="sidebar-header">
    <h2>Urban Governance Flow</h2>
    <button id="theme-toggle" onclick="toggleTheme()" title="Dark/Light Mode">◑</button>
  </div>

  <div id="mode-toggle" style="display:none">
    <button class="mode-btn active" id="mode-btn-nutzer" onclick="setMode('nutzer')">Nutzer</button>
    <button class="mode-btn" id="mode-btn-admin" onclick="setMode('admin')">Admin</button>
  </div>

  <!-- Nutzer panel -->
  <div id="user-panel">

    <div id="zone-warning" style="display:none">
      <span id="zone-warning-text-small"></span>
    </div>

    <div id="route-inputs">
      <div class="input-group">
        <label for="start">Start</label>
        <input id="start" placeholder="z.B. Alexanderplatz, Berlin" oninput="searchAddress('start')" onblur="calculateRoute()">
        <ul id="suggestions-start"></ul>
      </div>

      <div class="swap-row">
        <button id="swap-btn" onclick="swapRoute()" title="Start und Ziel tauschen">&#8645;</button>
      </div>

      <div class="input-group">
        <label for="end">Ziel</label>
        <input id="end" placeholder="z.B. Brandenburger Tor, Berlin" oninput="searchAddress('end')" onblur="calculateRoute()">
        <ul id="suggestions-end"></ul>
      </div>
    </div>

    <div class="button-group">
      <button id="zones-toggle-btn" onclick="toggleZones()">Aktive Zonen ausblenden</button>
      <button onclick="calculateRoute()">Route anzeigen</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Admin panel -->
  <div id="admin-panel" style="display:none">

    <div id="draw-controls">
      <button id="draw-btn" onclick="startDrawing()">+ Neue Zone zeichnen</button>
      <div id="draw-active" style="display:none">
        <p class="draw-hint">Klick = Punkt setzen &middot; Doppelklick = Abschließen</p>
        <button class="btn-secondary-full" onclick="cancelDrawing()">Abbrechen</button>
      </div>
    </div>

    <div id="zone-form-panel" style="display:none">
      <form id="zone-form" onsubmit="submitZone(event)">
        <div class="input-group">
          <label>Name</label>
          <input id="zone-name" required>
        </div>
        <div class="input-group">
          <label>Grund</label>
          <input id="zone-reason" placeholder="z.B. Marathon, Baustelle">
        </div>
        <div class="input-group">
          <label>Start</label>
          <input id="zone-start" type="datetime-local" required>
        </div>
        <div class="input-group">
          <label>Ende</label>
          <input id="zone-end" type="datetime-local" required>
        </div>
        <p class="auth-error" id="zone-error"></p>
        <div class="button-group">
          <button type="submit">Zone speichern</button>
          <button type="button" onclick="cancelZoneForm()">Abbrechen</button>
        </div>
      </form>
    </div>

    <div id="zone-list-panel">
      <p class="section-label">Vorhandene Zonen</p>
      <div id="zone-list"></div>
    </div>

    <div class="button-group">
      <button onclick="logout()">Logout</button>
    </div>

  </div>
</nav>

<div id="map"></div>

<div id="zone-warning-modal" style="display:none">
  <div id="zone-warning-modal-box">
    <p id="zone-warning-text">⚠️</p>
    <button onclick="dismissZoneWarning()">Ignorieren</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="config.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
