<!DOCTYPE html>
<html data-theme="light">
<head>
  <title>Urban Governance Flow</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<nav id="sidebar">
  <div id="sidebar-header">
    <h2>Urban Governance Flow</h2>
    <button id="theme-toggle" onclick="toggleTheme()" title="Dark/Light Mode">◑</button>
  </div>

  <div id="zone-legend">
    <span><span class="legend-dot" style="background:blue"></span> Geplant</span>
    <span><span class="legend-dot" style="background:red"></span> Aktiv</span>
    <span><span class="legend-dot" style="background:gray"></span> Abgelaufen</span>
  </div>

  <div class="input-group">
    <label for="start">Start</label>
    <input id="start" placeholder="z.B. Alexanderplatz, Berlin" oninput="searchAddress('start')" onblur="calculateRoute()">
    <ul id="suggestions-start"></ul>
  </div>

  <div class="input-group">
    <label for="end">Ziel</label>
    <input id="end" placeholder="z.B. Brandenburger Tor, Berlin" oninput="searchAddress('end')" onblur="calculateRoute()">
    <ul id="suggestions-end"></ul>
  </div>

  <div class="button-group">
    <button onclick="login()">Login</button>
    <button onclick="loadZones()">Zonen anzeigen</button>
    <button onclick="drawRoute()">Route anzeigen</button>
  </div>
</nav>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="config.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
