<!DOCTYPE html>
<html>
<head>
  <title>Urban Governance Flow</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div id="sidebar">
  <h2>Urban Governance Flow</h2>

  <button onclick="login()">Login</button>
  <button onclick="loadZones()">Zonen anzeigen</button>
  <button onclick="drawRoute()">Route anzeigen</button>

  <div id="zone-legend">
    <span><span class="legend-dot" style="background:blue"></span> Geplant</span>
    <span><span class="legend-dot" style="background:red"></span> Aktiv</span>
    <span><span class="legend-dot" style="background:gray"></span> Abgelaufen</span>
  </div>
  
  <input id="address" placeholder="Adresse eingeben" oninput="searchAddress()">
<ul id="suggestions" style="background: white; list-style: none; padding: 0;"></ul>


  <input id="start" placeholder="Start">
  <input id="end" placeholder="Ziel">


</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
