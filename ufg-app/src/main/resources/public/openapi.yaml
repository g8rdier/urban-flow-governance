openapi: 3.0.3
info:
  title: Urban Flow Governance API
  description: REST API für das Urban Flow Governance System
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Lokaler Entwicklungsserver

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID

  schemas:
    ApiResponse:
      type: object
      required: [status, msg]
      properties:
        status:
          type: string
          enum: [success, failure]
        msg:
          type: string
        data:
          type: object
          additionalProperties: true

    Zone:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        reason:
          type: string
        geometry:
          $ref: '#/components/schemas/GeoJsonPolygon'
        startTime:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        endTime:
          type: string
          format: date-time
          example: "2024-12-31T23:59:59Z"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string

    GeoJsonPolygon:
      type: object
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
      example:
        type: Polygon
        coordinates: [[[13.4, 52.5], [13.5, 52.5], [13.5, 52.6], [13.4, 52.6], [13.4, 52.5]]]

paths:

  /api/session:
    post:
      summary: Login
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login erfolgreich
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [token, token_type, expires_in_minutes]
                        properties:
                          token:
                            type: string
                            format: uuid
                          token_type:
                            type: string
                            enum: [Bearer]
                          expires_in_minutes:
                            type: integer
                            minimum: 1
              example:
                status: success
                msg: Login successful
                data:
                  token: 9e5d13a0-6b5e-4c20-8af3-e991b655f350
                  token_type: Bearer
                  expires_in_minutes: 60
        '400':
          description: Username oder Passwort fehlt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Ungültige Anmeldedaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

    get:
      summary: Aktuellen User und Rollen abrufen
      tags: [Auth]
      responses:
        '200':
          description: User-Informationen
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            type: object
        '401':
          description: Nicht eingeloggt oder ungültiger Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

    delete:
      summary: Logout
      tags: [Auth]
      responses:
        '200':
          description: Logout erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Nicht eingeloggt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/users:
    post:
      summary: Neuen User anlegen
      tags: [Benutzerverwaltung]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, NUTZER]
      responses:
        '201':
          description: User erfolgreich angelegt
        '400':
          description: Ungültige Eingabe
        '403':
          description: Keine ADMIN-Berechtigung

  /api/users/{id}:
    put:
      summary: User aktualisieren
      tags: [Benutzerverwaltung]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, NUTZER]
      responses:
        '200':
          description: User aktualisiert
        '403':
          description: Keine ADMIN-Berechtigung
        '404':
          description: User nicht gefunden

    patch:
      summary: User teilweise aktualisieren
      tags: [Benutzerverwaltung]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [ADMIN, NUTZER]
      responses:
        '200':
          description: User aktualisiert
        '403':
          description: Keine ADMIN-Berechtigung
        '404':
          description: User nicht gefunden

    delete:
      summary: User löschen
      tags: [Benutzerverwaltung]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User gelöscht
        '403':
          description: Keine ADMIN-Berechtigung
        '404':
          description: User nicht gefunden

  /api/zones:
    get:
      summary: Alle Sperrzonen abrufen
      security: []
      tags: [Sperrzonen]
      responses:
        '200':
          description: Liste aller Zonen
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          zones:
                            type: array
                            items:
                              $ref: '#/components/schemas/Zone'

    post:
      summary: Neue Sperrzone anlegen
      tags: [Sperrzonen]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, geometry]
              properties:
                name:
                  type: string
                description:
                  type: string
                reason:
                  type: string
                startTime:
                  type: string
                  format: date-time
                  example: "2024-01-01T00:00:00Z"
                endTime:
                  type: string
                  format: date-time
                  example: "2024-12-31T23:59:59Z"
                createdBy:
                  type: string
                geometry:
                  $ref: '#/components/schemas/GeoJsonPolygon'
      responses:
        '201':
          description: Zone angelegt
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          zone:
                            $ref: '#/components/schemas/Zone'
        '400':
          description: Ungültige Eingabe
        '403':
          description: Keine ADMIN-Berechtigung

  /api/zones/{id}:
    get:
      summary: Einzelne Sperrzone abrufen
      security: []
      tags: [Sperrzonen]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Zone gefunden
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          zone:
                            $ref: '#/components/schemas/Zone'
        '404':
          description: Zone nicht gefunden

    put:
      summary: Sperrzone aktualisieren
      tags: [Sperrzonen]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                reason:
                  type: string
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                createdBy:
                  type: string
                geometry:
                  $ref: '#/components/schemas/GeoJsonPolygon'
      responses:
        '200':
          description: Zone aktualisiert
        '400':
          description: Ungültige Eingabe
        '403':
          description: Keine ADMIN-Berechtigung
        '404':
          description: Zone nicht gefunden

    delete:
      summary: Sperrzone löschen
      tags: [Sperrzonen]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Zone gelöscht
        '403':
          description: Keine ADMIN-Berechtigung
        '404':
          description: Zone nicht gefunden

  /api/zones/{id}/activate:
    put:
      summary: Sperrzone aktivieren
      tags: [Sperrzonen]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Zone aktiviert
        '403':
          description: Keine ADMIN-Berechtigung
        '404':
          description: Zone nicht gefunden
        '409':
          description: Zone bereits aktiviert

  /api/zones/{id}/deactivate:
    put:
      summary: Sperrzone deaktivieren
      tags: [Sperrzonen]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Zone deaktiviert
        '403':
          description: Keine ADMIN-Berechtigung
        '404':
          description: Zone nicht gefunden
        '409':
          description: Zone bereits deaktiviert

  /api/route/check:
    post:
      summary: Route auf Sperrzonen prüfen
      security: []
      tags: [Routen]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route]
              properties:
                route:
                  type: array
                  minItems: 2
                  items:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: number
                  example: [[52.5, 13.4], [52.6, 13.5]]
      responses:
        '200':
          description: Prüfergebnis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [OK, WARNING]
                          zones:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                reason:
                                  type: string
        '400':
          description: Route fehlt oder hat weniger als 2 Punkte
